  nav.subtabs button.active{color:var(--primary);border-bottom-color:var(--primary);}
  nav.subtabs button .b{font-size:.7rem;font-weight:700;color:var(--warning-fg);}
  nav.subtabs button .b.err{color:var(--fail);}

  .panel{display:none;}.panel.active{display:block;}
  .subpanel{display:none;}.subpanel.active{display:block;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.6rem 1.9rem;box-shadow:0 1px 3px rgba(0,0,0,.04);margin-bottom:1.1rem;}

  .stat{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:1rem .75rem;text-align:center;}
  .stat .num{font-size:1.7rem;font-weight:800;letter-spacing:-.03em;line-height:1;}

  .artifact-meta code{background:rgba(0,0,0,.06);padding:.1em .4em;border-radius:5px;color:var(--fg);}

  .check-item.open .check-body{display:block;}

  .check-body .fail-reason.error{background:var(--error-bg);color:var(--error-fg);}
  .check-body .fail-reason.informative{background:var(--info-bg);color:var(--info-fg);}

  .finding.error{border-color:#fecaca;}.finding.warning{border-color:#fed7aa;}.finding.informative{border-color:#99f6e4;}

  .fix{margin-top:.45rem;padding:.55rem .75rem;background:var(--info-bg);color:var(--info-fg);border-radius:7px;}

  .acc li:last-child{border-bottom:0;}

  .acc .claim{font-weight:600;color:var(--fg);}
  .acc .detail{color:var(--muted);}

  .ov-table th,.ov-table td{text-align:left;padding:.6rem .7rem;border-bottom:1px solid var(--border);}
  .ov-table th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);}
  .ov-table td.n{font-weight:700;text-align:center;}
  .pill{display:inline-block;font-size:.72rem;font-weight:700;padding:.15em .55em;border-radius:999px;}

<script>
  document.getElementById("genat").textContent = "\u00b7 " + new Date().toISOString().slice(0,10);
  const skills = ["grouping","payments","secondary"].map(id => JSON.parse(document.getElementById("data-"+id).textContent));

  const sevClass={error:"sev-error",warning:"sev-warning",informative:"sev-informative",good:"sev-good"};
  const sevLabel={error:"Error",warning:"Warning",informative:"Info",good:"Good"};
  function esc(s){return String(s).replace(/&(?![a-z#])/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  function statusIcon(r){if(r==="PASS")return{cls:"pass",g:"\u2713"};if(r==="FAIL")return{cls:"fail",g:"\u2717"};return{cls:"na",g:"\u2014"};}

  function allItems(sk){const a=[];sk.sections.forEach(s=>s.items.forEach(i=>a.push(i)));(sk.guideline||[]).forEach(g=>g.items.forEach(i=>a.push(i)));return a;}
  function counts(sk){const c={error:0,warning:0,informative:0};allItems(sk).forEach(i=>{if(i.result==="FAIL"&&c[i.severity]!==undefined)c[i.severity]++;});return c;}
  function secFails(items){return items.filter(i=>i.result==="FAIL").length;}

  function renderCheck(it){
    const st=statusIcon(it.result);
    const hasBody=it.description||it.note;
    const chev=hasBody?'<svg class="chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6l4 4 4-4"/></svg>':"";
    let badges="";
    if(it.result==="FAIL")badges='<span class="sev-badge '+sevClass[it.severity]+'">'+sevLabel[it.severity]+'</span>';
    let body="";
    if(hasBody){
      const parts=[];
      if(it.description)parts.push('<p><strong>What this checks</strong> \u2014 '+esc(it.description)+'</p>');
      if(it.result==="FAIL"&&it.note)parts.push('<div class="fail-reason '+esc(it.severity)+'"><strong>Why it failed</strong> \u2014 '+esc(it.note)+'</div>');
      else if(it.note)parts.push('<p><strong>Note</strong> \u2014 '+esc(it.note)+'</p>');
      body='<div class="check-body">'+parts.join("")+'</div>';
    }
    const open=it.result==="FAIL";
    const toggle=hasBody?'onclick="this.closest(\'.check-item\').classList.toggle(\'open\')"':"";
    return '<li class="check-item '+st.cls+(open?' open':'')+'"><button type="button" class="check-header" '+toggle+'>'
      +'<span class="status-icon '+st.cls+'">'+st.g+'</span><span class="check-title">'+esc(it.check)+'</span>'
      +'<span class="check-badges">'+badges+chev+'</span></button>'+body+'</li>';
  }
  function renderContainer(sk,sec){
    const f=secFails(sec.items);
    return '<div class="card"><h2>'+esc(sec.name)+'</h2>'
      +'<p class="artifact-meta">Skill \u00b7 <code>'+esc(sk.files[0])+'</code> \u00b7 checklist: <code>skill-checklist.md</code> \u00b7 '+sec.items.length+' checks \u00b7 '+f+' finding'+(f===1?'':'s')+'</p>'
      +'<ul class="checklist">'+sec.items.map(renderCheck).join("")+'</ul></div>';
  }
  function renderGuideline(sk){
    if(!sk.guideline||!sk.guideline.length)return '<div class="card"><p>No discrete embedded guideline lines scored.</p></div>';
    return sk.guideline.map(g=>{
      const f=secFails(g.items);
      return '<div class="card"><h2>'+esc(g.file.split("/").pop())+'</h2>'
        +'<p class="artifact-meta"><code>'+esc(g.file)+'</code> \u00b7 checklist: <code>guideline-rule-checklist.md</code> \u00b7 '+g.items.length+' line'+(g.items.length===1?'':'s')+' \u00b7 '+f+' finding'+(f===1?'':'s')+'</p>'
        +'<ul class="checklist">'+g.items.map(renderCheck).join("")+'</ul></div>';
    }).join("");
  }
  function renderAccuracy(sk){
    const ok=sk.accuracyChecks.filter(a=>a.verified).length, no=sk.accuracyChecks.length-ok;
    const rows=sk.accuracyChecks.map(a=>'<li><span class="dot '+(a.verified?'ok':'no')+'">'+(a.verified?'\u2713':'\u2717')+'</span>'
      +'<span><span class="claim">'+esc(a.claim)+'</span><br><span class="detail">'+esc(a.detail)+'</span></span></li>').join("");
    return '<div class="card"><h2>Accuracy spot-check</h2>'
      +'<p class="artifact-meta">'+ok+' of '+sk.accuracyChecks.length+' cited claims verified against <code>main</code>'+(no?' \u00b7 '+no+' mismatch':'')+'.</p>'
      +'<ul class="acc">'+rows+'</ul></div>';
  }
  function renderSkillSummary(sk){
    const c=counts(sk);
    const findings=(sk.headlineFindings||[]).map(f=>{
      const fix=f.fix?'<div class="fix"><strong>Fix</strong> \u2014 '+esc(f.fix)+'</div>':"";
      return '<div class="finding '+f.severity+'"><div class="finding-head"><span class="finding-title">'+esc(f.title)+'</span>'
        +'<span class="sev-badge '+sevClass[f.severity]+'">'+sevLabel[f.severity]+'</span></div>'
        +'<div class="finding-body"><span class="loc">'+esc(f.loc)+'</span><p>'+esc(f.desc)+'</p>'+fix+'</div></div>';
    }).join("");
    return '<div class="card"><h2>'+esc(sk.skill)+' \u2014 summary</h2><p>'+esc(sk.summaryParagraph)+'</p>'
      +'<div class="summary-grid">'
      +'<div class="stat error"><div class="num">'+c.error+'</div><div class="lbl">Errors</div></div>'
      +'<div class="stat warning"><div class="num">'+c.warning+'</div><div class="lbl">Warnings</div></div>'
      +'<div class="stat informative"><div class="num">'+c.informative+'</div><div class="lbl">Info</div></div>'
      +'<div class="stat tok"><div class="num">~'+sk.tokenEstimateSkillMd+'</div><div class="lbl">SKILL.md tokens</div></div>'
      +'</div>'
      +'<p class="agent">Reviewed by sub-agent <code>'+esc(sk.agentId)+'</code> \u00b7 '+sk.files.length+' file'+(sk.files.length===1?'':'s')+'.</p></div>'
      +(findings?'<div class="card"><h2>Headline findings</h2>'+findings+'</div>':'<div class="card"><p>No headline findings.</p></div>');
  }

  /* outer tabs */
  const maintabs=document.getElementById("maintabs"), panels=document.getElementById("panels");
  function addMain(id,label,countHtml,active){
    const b=document.createElement("button");b.dataset.tab=id;b.innerHTML=label+(countHtml||"");if(active)b.classList.add("active");
    b.addEventListener("click",()=>activateMain(id));maintabs.appendChild(b);
    const p=document.createElement("section");p.className="panel"+(active?" active":"");p.id=id;panels.appendChild(p);return p;
  }
  function activateMain(id){
    document.querySelectorAll("#maintabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===id));
    document.querySelectorAll("#panels > .panel").forEach(p=>p.classList.toggle("active",p.id===id));
  }

  /* Overview */
  (function(){
    const p=addMain("overview","Overview","",true);
    let tot={error:0,warning:0,informative:0};
    const rows=skills.map(sk=>{
      const c=counts(sk);tot.error+=c.error;tot.warning+=c.warning;tot.informative+=c.informative;
      const ok=sk.accuracyChecks.filter(a=>a.verified).length;
      return '<tr><td><strong>'+esc(sk.skill)+'</strong><br><span class="detail" style="font-size:.78rem;color:var(--muted)">'+sk.files.length+' files \u00b7 ~'+sk.tokenEstimateSkillMd+' tok</span></td>'
        +'<td class="n">'+(c.error?'<span class="pill err">'+c.error+'</span>':'\u2014')+'</td>'
        +'<td class="n">'+(c.warning?'<span class="pill warn">'+c.warning+'</span>':'\u2014')+'</td>'
        +'<td class="n">'+c.informative+'</td>'
        +'<td class="n">'+ok+'/'+sk.accuracyChecks.length+'</td></tr>';
    }).join("");
    p.innerHTML='<div class="card"><h2>Per-skill SDLC review \u2014 overview</h2>'
      +'<p>Each of the three new skills in PR #10228 was reviewed independently by its own sub-agent against the local <code>.cursor/skills/sdlc</code> checklists. Open a skill\u2019s tab above for its dedicated multi-tab report.</p>'
      +'<div class="summary-grid" style="grid-template-columns:repeat(3,1fr)">'
      +'<div class="stat error"><div class="num">'+tot.error+'</div><div class="lbl">Errors (all skills)</div></div>'
      +'<div class="stat warning"><div class="num">'+tot.warning+'</div><div class="lbl">Warnings</div></div>'
      +'<div class="stat informative"><div class="num">'+tot.informative+'</div><div class="lbl">Info</div></div></div>'
      +'<table class="ov-table"><thead><tr><th>Skill</th><th style="text-align:center">Errors</th><th style="text-align:center">Warnings</th><th style="text-align:center">Info</th><th style="text-align:center">Accuracy</th></tr></thead><tbody>'+rows+'</tbody></table>'
      +'</div>'
      +'<div class="card"><h3 style="margin-top:0">Shared across all three</h3>'
      +'<ul style="margin:0;padding-left:1.2rem"><li>Missing <code>allowed-tools</code> and <code>version</code> in frontmatter (warnings).</li>'
      +'<li>No <code>evals/</code> shipped (N/A for grouping/payments as pure docs; a FAIL for <code>secondary</code> which declares an explicit should-not-trigger boundary).</li></ul></div>'
      +'<div class="card"><h3 style="margin-top:0">Skill-specific highlights</h3>'
      +'<ul style="margin:0;padding-left:1.2rem">'
      +'<li><strong>payments</strong> \u2014 the only <span class="pill err">error</span>: ~2,600-token SKILL.md over the lean budget, no <code>references/</code> (sole skill in the PR without progressive disclosure).</li>'
      +'<li><strong>secondary</strong> \u2014 an accuracy bug: <code>deriveCustomerFacingStatus()</code> is attributed to the wrong file.</li>'
      +'<li><strong>grouping</strong> \u2014 cleanest: lean, well-disclosed, all 9 cited claims verified.</li>'
      +'</ul></div>';
  })();

  /* one dedicated tab per skill, each with its own subtabs */
  skills.forEach(sk=>{
    const c=counts(sk);
    const badge=(c.error?' <span class="count" style="color:var(--fail)">('+c.error+'e/'+c.warning+'w)</span>':' <span class="count">('+c.warning+'w)</span>');
    const panel=addMain("skill-"+sk.skill, sk.skill, badge, false);
    const subnav=document.createElement("nav");subnav.className="subtabs";
    const subwrap=document.createElement("div");
    panel.appendChild(subnav);panel.appendChild(subwrap);

    const subtabs=[];
    subtabs.push({id:"sum",label:"Summary",html:renderSkillSummary(sk),badge:""});
    sk.sections.forEach((sec,i)=>{
      const f=secFails(sec.items);
      subtabs.push({id:"sec"+i,label:sec.name,html:renderContainer(sk,sec),
        badge:f?' <span class="b'+(sec.items.some(x=>x.result==="FAIL"&&x.severity==="error")?' err':'')+'">'+f+'</span>':''});
    });
    const gf=(sk.guideline||[]).reduce((n,g)=>n+secFails(g.items),0);
    subtabs.push({id:"guide",label:"Instruction & Rule",html:renderGuideline(sk),badge:gf?' <span class="b">'+gf+'</span>':''});
    subtabs.push({id:"acc",label:"Accuracy",html:renderAccuracy(sk),badge:''});

    subtabs.forEach((t,i)=>{
      const b=document.createElement("button");b.innerHTML=t.label+t.badge;b.dataset.sub=sk.skill+"-"+t.id;if(i===0)b.classList.add("active");
      b.addEventListener("click",()=>{
        subnav.querySelectorAll("button").forEach(x=>x.classList.toggle("active",x.dataset.sub===b.dataset.sub));
        subwrap.querySelectorAll(".subpanel").forEach(p=>p.classList.toggle("active",p.id===b.dataset.sub));
      });
      subnav.appendChild(b);
      const sp=document.createElement("section");sp.className="subpanel"+(i===0?" active":"");sp.id=sk.skill+"-"+t.id;sp.innerHTML=t.html;subwrap.appendChild(sp);
    });
  });
</script>
