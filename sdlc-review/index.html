        const loaded = await Promise.all(prFiles.map((file) => fetch(file).then((response) => {
          if (!response.ok) throw new Error(`${file} returned ${response.status}`);
          return response.json();
        })));
        return loaded;
      } catch (error) {
        console.warn('Falling back to embedded snapshot because JSON files could not be loaded.', error);
        return fallbackData;
      }
    }

    function render(prs) {
      const tabs = document.getElementById('tabs');
      const panels = document.getElementById('panels');
      tabs.innerHTML = prs.map((pr, index) => `<button class="tab-button" type="button" role="tab" aria-selected="${index === 0}" aria-controls="pr-${pr.number}" id="tab-${pr.number}">#${pr.number}</button>`).join('');
      panels.innerHTML = prs.map((pr, index) => renderPanel(pr, index === 0)).join('');

      const tabButtons = Array.from(document.querySelectorAll('.tab-button'));
      const tabPanels = Array.from(document.querySelectorAll('.tab-panel'));
      tabButtons.forEach((button) => button.addEventListener('click', () => {
        tabButtons.forEach((tab) => tab.setAttribute('aria-selected', 'false'));
        tabPanels.forEach((panel) => panel.classList.remove('active'));
        button.setAttribute('aria-selected', 'true');
        document.getElementById(button.getAttribute('aria-controls'))?.classList.add('active');
      }));
    }

    function renderPanel(pr, active) {
      const status = pr.status === 'closed' ? 'Closed / merged' : String(pr.status || pr.state || '').replace(/^./, (c) => c.toUpperCase());
      const breakdown = (pr.fileBreakdown || []).map((entry) => `<div class="breakdown-row"><span>${escapeHtml(entry.kind)}</span><div class="bar"><span style="width:${entry.percentage}%"></span></div><span>${entry.percentage}%</span></div>`).join('');
      const summary = (pr.summaryParagraphs || []).map((paragraph) => `<p>${escapeHtml(paragraph)}</p>`).join('');
      const files = (pr.files || []).map((file) => `<li>${escapeHtml(file.path)} (+${file.additions || 0} / -${file.deletions || 0})</li>`).join('');
      const findings = pr.findings?.length ? `<ul class="finding-list">${pr.findings.map((finding) => `<li><strong>${escapeHtml(finding.title)}</strong><br />${escapeHtml(finding.text)}<br />${escapeHtml(finding.file)}:${escapeHtml(finding.lineNumber)}</li>`).join('')}</ul>` : '<p class="empty">No findings recorded yet.</p>';
      const reviewerSummary = pr.otherReviewerFeedback?.summary || 'No human reviewer feedback found';
      const descriptionLength = pr.descriptionLength || {words: 0, paragraphs: 0};
      return `<section class="tab-panel${active ? ' active' : ''}" role="tabpanel" id="pr-${pr.number}" aria-labelledby="tab-${pr.number}">
        <div class="meta-header"><div><h2>${escapeHtml(pr.title)}</h2><a href="${escapeHtml(pr.url)}">${escapeHtml(pr.url)}</a></div><span class="badge ${pr.status === 'closed' ? 'closed' : 'open'}">${escapeHtml(status)}</span></div>
        <div class="metrics"><div class="metric"><span class="metric-label">PR number</span><span class="metric-value">${pr.number}</span></div><div class="metric"><span class="metric-label">Creator</span><span class="metric-value small">${escapeHtml(pr.creator)}</span></div><div class="metric"><span class="metric-label">Files changed</span><span class="metric-value">${pr.changedFiles}</span></div><div class="metric"><span class="metric-label">Diff size</span><span class="metric-value">+${Number(pr.additions || 0).toLocaleString()} / -${Number(pr.deletions || 0).toLocaleString()}</span></div><div class="metric"><span class="metric-label">Description length</span><span class="metric-value small">${descriptionLength.words} words, ${descriptionLength.paragraphs} paragraphs</span></div></div>
        <div class="review-metrics"><div class="metric"><span class="metric-label">Status</span><span class="metric-value">${escapeHtml(status)}</span></div><div class="metric"><span class="metric-label">CodeRabbit comments</span><span class="metric-value">${pr.codeRabbitComments || 0}</span></div><div class="metric"><span class="metric-label">Did Yoni review</span><span class="metric-value">${pr.didYoniReview ? 'Yes' : 'No'}</span></div><div class="metric"><span class="metric-label">Yoni findings</span><span class="metric-value">${pr.howManyYoniFindings || 0}</span></div><div class="metric"><span class="metric-label">Did you leave PR comments</span><span class="metric-value">${pr.didYouLeavePrComments ? 'Yes' : 'No'}</span></div></div>
        <div class="metric" style="margin-bottom:24px"><span class="metric-label">Other reviewer feedback</span><span class="metric-value small">${escapeHtml(reviewerSummary)}</span></div>
        <div class="columns"><div class="summary"><h3>Two paragraph summary</h3>${summary}</div><div><h3>File-type breakdown</h3><div class="breakdown">${breakdown}</div></div></div>
        <details><summary>Yoni findings</summary>${findings}</details>
        <details><summary>Changed files</summary><ul class="file-list">${files}</ul></details>
      </section>`;
    }

    loadData().then(render);
  </script>
</body>
</html>
